name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Public Sanity coordinates, the same pair committed in .env.example. The build
# does not read them today because the Studio route is dynamic, but it will as
# soon as a page reads content at build time.
env:
  NEXT_PUBLIC_SANITY_PROJECT_ID: e72p6sym
  NEXT_PUBLIC_SANITY_DATASET: production

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # LayoutProps and the other route types are generated, not shipped. A
      # fresh checkout has no .next, so tsc cannot see them until this runs.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
